<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvio Badges Studio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="container">
        <ul>
            <li>
                <strong>🏷️ Nuvio Badges Studio</strong>
                <span style="font-size: 0.8rem; color: var(--pico-muted-color); display: block; margin-top: 2px;">Minimalist stream ruleset customizer</span>
            </li>
        </ul>
        <ul>
            <li>
                <button id="btn-copy-json" class="outline secondary" style="font-size: 0.8rem; padding: 0.5rem 1rem;">
                    Copy Config
                </button>
            </li>
            <li>
                <button id="btn-export-json" style="font-size: 0.8rem; padding: 0.5rem 1rem;">
                    Export JSON
                </button>
            </li>
        </ul>
    </nav>

    <main class="container">
        <div class="grid">
            <section>
                <article style="margin-top: 0;">
                    <header style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: bold;">Configuration</span>
                        <span id="badge-count-badge" style="font-size: 0.75rem; color: var(--pico-muted-color);">0 Active</span>
                    </header>

                    <div role="group" style="margin-bottom: 1.5rem;">
                        <button class="segment-btn active" data-tab="tab-edit" style="font-size: 0.8rem; padding: 0.5rem;">Edit Filters</button>
                        <button class="segment-btn outline secondary" data-tab="tab-add" style="font-size: 0.8rem; padding: 0.5rem;">Add Badge</button>
                    </div>

                    <div class="tab-content" id="tab-edit">
                        <div id="groups-accordion-container">
                            <div class="loading-state">Syncing badges database...</div>
                        </div>
                    </div>

                    <div class="tab-content hidden" id="tab-add">
                        <form id="add-badge-form">
                            <div class="grid">
                                <label>
                                    Badge Name
                                    <input type="text" id="new-badge-name" placeholder="e.g. ⚡ Vidlink" required>
                                </label>
                                <label>
                                    Filter ID
                                    <input type="text" id="new-badge-id" placeholder="e.g. p-vidlink" required>
                                </label>
                            </div>

                            <label>
                                Regex Matching Pattern
                                <input type="text" id="new-badge-pattern" placeholder="e.g. (?i)vidlink" required>
                                <small>Case-insensitive matching keyword for the scraper streams.</small>
                            </label>

                            <label>
                                Group Category
                                <select id="new-badge-group" required>
                                    <option value="gp">Providers</option>
                                    <option value="gq">Quality (Remux, BluRay)</option>
                                    <option value="gr">Resolution (4K, 1080p)</option>
                                    <option value="gv">Visual (DV, HDR)</option>
                                    <option value="ga">Audio (Atmos, TrueHD)</option>
                                    <option value="gc">Channels (5.1, 7.1)</option>
                                    <option value="gl">Language</option>
                                </select>
                            </label>

                            <fieldset>
                                <legend>Icon Graphic Style</legend>
                                <div class="grid" style="margin-top: 0.5rem;">
                                    <label>
                                        <input type="radio" name="icon-style" value="shields" checked>
                                        Shields.io
                                    </label>
                                    <label>
                                        <input type="radio" name="icon-style" value="custom">
                                        Custom Asset
                                    </label>
                                </div>
                            </fieldset>

                            <div id="shields-params">
                                <div class="grid">
                                    <label>
                                        Shield Label
                                        <input type="text" id="new-badge-label" placeholder="e.g. ⚡ Vidlink">
                                    </label>
                                    <label>
                                        Color (Hex)
                                        <div style="display: flex; gap: 0.5rem;">
                                            <input type="color" id="new-badge-color-picker" value="#00D2FF" style="padding: 0; width: 44px; height: 44px; cursor: pointer; border: none; background: none;">
                                            <input type="text" id="new-badge-color-text" value="#00D2FF" placeholder="#00D2FF">
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div id="custom-url-param" class="hidden">
                                <label>
                                    Custom Image URL
                                    <input type="url" id="new-badge-imageurl" placeholder="https://raw.githubusercontent.com/.../icon.png">
                                </label>
                            </div>

                            <div class="grid">
                                <label>
                                    Tag Style
                                    <select id="new-badge-style">
                                        <option value="outlined">Outlined Card</option>
                                        <option value="filled">Filled Card</option>
                                        <option value="filled and bordered">Filled & Bordered</option>
                                    </select>
                                </label>
                                <label>
                                    Border Color
                                    <div style="display: flex; gap: 0.5rem;">
                                        <input type="color" id="new-badge-border-picker" value="#00D2FF" style="padding: 0; width: 44px; height: 44px; cursor: pointer; border: none; background: none;">
                                        <input type="text" id="new-badge-border-text" value="#00D2FF" placeholder="#00D2FF">
                                    </div>
                                </label>
                            </div>

                            <button type="submit" class="primary" style="margin-top: 1rem;">
                                Add Filter to Config
                            </button>
                        </form>
                    </div>
                </article>
            </section>

            <section>
                <article style="margin-top: 0; margin-bottom: 2rem;">
                    <header><b>Live Stream Preview</b></header>

                    <label>
                        Simulate Stream Title / Description
                        <input type="text" id="test-stream-title" value="Vidlink | 1080p | TrueHD Atmos | Dual-Audio | WebDL">
                    </label>

                    <div class="sim-stream-card">
                        <div class="sim-meta">
                            <h4 id="n-stream-title" style="margin-bottom: 0.2rem; font-size: 1.05rem;">Vidlink | Auto</h4>
                            <p id="n-stream-desc" style="font-size: 0.8rem; color: var(--pico-muted-color); margin-bottom: 0;">1080p • 1.54 GB • Multi</p>
                        </div>
                        <div class="badges-row" id="n-badges-row"></div>
                    </div>
                </article>

                <article>
                    <header><b>Generated badges.json</b></header>
                    <div class="code-viewport">
                        <pre><code id="json-code-block" class="language-json">Loading JSON data...</code></pre>
                    </div>
                </article>
            </section>
        </div>
    </main>
</body>
</html>
